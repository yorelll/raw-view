# Build raw-view .exe / .zip and attach them to a GitHub Release.
#
# Triggers:
#   - on tags like v0.1.0 (the official release path)
#   - on demand from the Actions tab (workflow_dispatch)
#
# What it does:
#   1. Runs the full test suite (so a broken release is never published)
#   2. Installs PyInstaller and builds the release artifacts:
#        a. zip bundle     -> dist/raw-view/  (launcher + GUI + CLI, ONE _internal)
#        b. single file    -> dist/raw-view.exe  (GUI only)
#      The zip bundle's three executables share a single _internal directory.
#      Building each with its own copy would take the download from ~132 MB to
#      ~383 MB, so the onedir builds are assembled: the windowed build's
#      tree is kept and both executables are copied into it (verified: 3176 of
#      3177 files are byte-identical between the two builds, and the only
#      difference - base_library.zip - is content-equivalent).
#      Each build is staged under .artifact/ first so the --noconfirm --clean
#      runs never delete each other's output.
#   3. Zips the onedir bundle into a "unzip-and-run" package with the
#      version in its file name (raw-view-<version>-windows-x64.zip).
#   4. Runs the exe with --help (CLI smoke test) and lists the artifacts
#   5. Attaches exe + zip + SHA-256 checksums to the release
#
# Version source of truth: the git tag (v0.1.0 -> product version 0.1.0).

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build exe + zip and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.Python_ROOT_DIR }}\Scripts
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 叠加 constraints.txt 锁定已实测一致的精确版本，保证可复现。
          # 注：-c/--constraint 必须与安装需求同一条命令使用；pyinstaller 单独按
          # constraints 锁定版本安装。
          pip install -r requirements.txt -c constraints.txt
          pip install pyinstaller==6.20.0

      - name: Run test suite
        run: python -m unittest discover -s tests -q

      - name: Smoke test CLI (before packaging)
        run: python -m raw_view --batch-help

      # PyInstaller 两次打包都会 --noconfirm --clean 清理 build/ 与 dist/，
      # 因此两次产物分别落盘到独立 staging 目录（.artifact/raw-view.exe 与
      # .artifact/raw-view/），避免 "后一次打包删掉前一次产物"。
      #
      # 第一次：onedir 目录 bundle（解压即用，含全部依赖）。
      # 注意：.venv 是本机专用路径，CI（GitHub Actions）默认把依赖装进 Actions 自带
      # 的 Python，不存在 .venv/；而 PyInstaller 对不存在的 --add-data 源目录会直接
      # 报 ERROR 失败。因此 translations 路径由当前 python 安装位置推导，
      # 两种环境都能跑；缺失时仅提示（Qt 自带默认英文本地化，不影响功能）。
      # PyInstaller 每次打包都会 --noconfirm --clean 清理 build/ 与 dist/，
      # 因此每次产物先落到独立 staging 目录（.artifact/...），避免互相删除。
      #
      # 三次构建、两个形态：
      #   1. onedir --windowed  raw_view/gui_entry.py -> raw-view-gui.exe + _internal
      #   2. onedir --console   raw_view/cli_entry.py -> raw-view-cli.exe
      #   3. onedir --windowed  raw_view/launcher.py  -> raw-view.exe (launcher)
      # 最终 zip 里三个 exe **共用一份 _internal**（取自构建 3）。
      # translations 路径由当前 python 安装位置推导，CI 与本机都能跑；缺失时仅提示。
      - name: Build onedir GUI half (windowed)
        run: |
          $QT_TRANSLATIONS = python -c "import os, PyQt5; print(os.path.join(os.path.dirname(PyQt5.__file__), 'Qt5', 'translations'))"
          $TRANS = @()
          if (Test-Path $QT_TRANSLATIONS) { $TRANS = @("--add-data", "$QT_TRANSLATIONS;Qt5/translations") }
          else { Write-Host "Qt5 translations not found; Qt falls back to English built-ins." }
          pyinstaller --noconfirm --clean --windowed --name raw-view-gui `
            --hidden-import=cv2 `
            --hidden-import=PIL `
            --collect-all=cv2 `
            --collect-all=PyQt5 `
            --collect-all=qt_material `
            --collect-all=qtawesome `
            --collect-all=pypinyin `
            --icon assets/raw-view.ico `
            --add-data "assets;assets" `
            @TRANS `
            --distpath .artifact/gui `
            --workpath build/gui `
            raw_view/gui_entry.py
          if (-not (Test-Path .artifact/gui/raw-view-gui/raw-view-gui.exe)) { throw "GUI half missing" }

      - name: Build onedir CLI half (console)
        run: |
          $QT_TRANSLATIONS = python -c "import os, PyQt5; print(os.path.join(os.path.dirname(PyQt5.__file__), 'Qt5', 'translations'))"
          $TRANS = @()
          if (Test-Path $QT_TRANSLATIONS) { $TRANS = @("--add-data", "$QT_TRANSLATIONS;Qt5/translations") }
          pyinstaller --noconfirm --clean --console --name raw-view-cli `
            --hidden-import=cv2 `
            --hidden-import=PIL `
            --collect-all=cv2 `
            --collect-all=PyQt5 `
            --collect-all=qt_material `
            --collect-all=qtawesome `
            --collect-all=pypinyin `
            --icon assets/raw-view.ico `
            --add-data "assets;assets" `
            @TRANS `
            --distpath .artifact/cli `
            --workpath build/cli `
            raw_view/cli_entry.py
          if (-not (Test-Path .artifact/cli/raw-view-cli/raw-view-cli.exe)) { throw "CLI half missing" }

      - name: Build onedir launcher
        run: |
          $QT_TRANSLATIONS = python -c "import os, PyQt5; print(os.path.join(os.path.dirname(PyQt5.__file__), 'Qt5', 'translations'))"
          $TRANS = @()
          if (Test-Path $QT_TRANSLATIONS) { $TRANS = @("--add-data", "$QT_TRANSLATIONS;Qt5/translations") }
          pyinstaller --noconfirm --clean --windowed --name raw-view `
            --hidden-import=cv2 `
            --hidden-import=PIL `
            --collect-all=cv2 `
            --collect-all=PyQt5 `
            --collect-all=qt_material `
            --collect-all=qtawesome `
            --collect-all=pypinyin `
            --icon assets/raw-view.ico `
            --add-data "assets;assets" `
            @TRANS `
            --distpath .artifact/bundle `
            --workpath build/launcher `
            raw_view/launcher.py
          if (-not (Test-Path .artifact/bundle/raw-view/raw-view.exe)) { throw "launcher missing" }

      # 单文件版：GUI only（PyInstaller --onefile 不允许同一 exe 同时是 console 与 GUI）。
      - name: Build single-file exe (GUI only)
        run: |
          $QT_TRANSLATIONS = python -c "import os, PyQt5; print(os.path.join(os.path.dirname(PyQt5.__file__), 'Qt5', 'translations'))"
          $TRANS = @()
          if (Test-Path $QT_TRANSLATIONS) { $TRANS = @("--add-data", "$QT_TRANSLATIONS;Qt5/translations") }
          pyinstaller --noconfirm --clean --onefile --windowed --name raw-view `
            --hidden-import=cv2 `
            --hidden-import=PIL `
            --collect-all=cv2 `
            --collect-all=PyQt5 `
            --collect-all=qt_material `
            --collect-all=qtawesome `
            --collect-all=pypinyin `
            --icon assets/raw-view.ico `
            --add-data "assets;assets" `
            @TRANS `
            --distpath .artifact/onefile `
            --workpath build/onefile `
            raw_view/gui_entry.py
          if (-not (Test-Path .artifact/onefile/raw-view.exe)) { throw "single-file exe missing" }

      - name: Collect release artifacts into dist
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse -Force .artifact/bundle/raw-view dist/raw-view
          Copy-Item -Force .artifact/gui/raw-view-gui/raw-view-gui.exe dist/raw-view/raw-view-gui.exe
          Copy-Item -Force .artifact/cli/raw-view-cli/raw-view-cli.exe dist/raw-view/raw-view-cli.exe
          Copy-Item -Force .artifact/onefile/raw-view.exe dist/raw-view.exe
          Get-ChildItem dist/raw-view | Select-Object Name, Length

      - name: Verify artifacts exist
        run: |
          $required = @(
            'dist\raw-view.exe',
            'dist\raw-view\raw-view.exe',
            'dist\raw-view\raw-view-gui.exe',
            'dist\raw-view\raw-view-cli.exe',
            'dist\raw-view\_internal'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "missing artifact: $path" }
          }
          Get-ChildItem dist\raw-view | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
          Get-Item dist\raw-view.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
          # The three executables must share ONE _internal, not three.
          $trees = @(Get-ChildItem dist\raw-view -Recurse -Directory -Filter _internal)
          if ($trees.Count -ne 1) { throw "expected exactly one _internal, found $($trees.Count)" }

      # 校验 PE subsystem：launcher/GUI 必须是 GUI(2)，CLI 必须是 Console(3)。
      # 这是三 exe 方案的核心契约——写错会让 CLI 弹黑框或让 GUI 带控制台。
      - name: Verify PE subsystems (2 / 2 / 3)
        shell: pwsh
        run: |
          function Get-Subsystem($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          }
          $expect = @{
            'dist\raw-view\raw-view.exe'     = 2
            'dist\raw-view\raw-view-gui.exe' = 2
            'dist\raw-view\raw-view-cli.exe' = 3
          }
          foreach ($pair in $expect.GetEnumerator()) {
            $actual = Get-Subsystem $pair.Key
            Write-Host "$($pair.Key): subsystem=$actual (expected $($pair.Value))"
            if ($actual -ne $pair.Value) { throw "wrong subsystem for $($pair.Key): $actual" }
          }

      # 冒烟：CLI 路径（直接测 console exe，避免 launcher 的终端依赖干扰 CI）。
      - name: Smoke test CLI executable
        run: .\dist\raw-view\raw-view-cli.exe --batch-help

      # 冒烟：launcher 转发（redirection 形式在 CI 里稳定可断言）。
      - name: Smoke test launcher forwarding
        shell: pwsh
        run: |
          .\dist\raw-view\raw-view.exe --version > version.txt
          Get-Content version.txt
          if (-not (Select-String -Path version.txt -Pattern 'raw-view' -Quiet)) {
            throw "launcher --version produced no output"
          }
          # 裸文件名必须是 usage 错误（rc=2），绝不能启动 GUI 阻塞 CI。
          .\dist\raw-view\raw-view.exe bare.raw 2>$null
          if ($LASTEXITCODE -ne 2) { throw "bare filename should exit 2, got $LASTEXITCODE" }

      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          # v0.1.0 -> 0.1.0 ; manual runs fall back to 0.1.0-dev
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == "refs/heads/"* || "$REF" == "$GITHUB_REF" ]]; then REF="0.1.0-dev"; fi
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      # 在版本号步骤之后压缩，zip 文件名才能带上版本号：
      #   dist/raw-view-<version>-windows-x64.zip
      # 源目录 dist/raw-view/ 由 "Collect release artifacts into dist" 步骤保证存在。
      - name: Compress onedir bundle into a zip
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ZIP = "dist\raw-view-$VERSION-windows-x64.zip"
          if (-not (Test-Path dist\raw-view)) { throw "source dist\raw-view not found" }
          if (Test-Path $ZIP) { Remove-Item $ZIP -Force }
          Compress-Archive -Path dist\raw-view -DestinationPath $ZIP
          Get-Item $ZIP | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum dist/raw-view.exe > dist/raw-view.exe.sha256
          # bash 的 glob 不会在重定向目标里展开，必须先用变量拿到 zip 的实际文件名
          ZIP="dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip"
          sha256sum "$ZIP" > "$ZIP.sha256"
          cat dist/raw-view.exe.sha256
          cat "$ZIP.sha256"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: raw-view ${{ steps.version.outputs.version }}
          # body 必须遵循 docs/release-template.md 的标准格式（发布即最终版，
          # 不再依赖事后 gh release edit）。每次打 tag 前，将当前版本的
          # 修复/新功能清单按模板填入下面的 body。占位符 {{ }} 由 GITHUB 上下文填充。
          body: |
            ## raw-view ${{ steps.version.outputs.version }}

            Python 实现的 RAW / YUV 图像查看与格式转换工具（Windows，提供**单文件 exe 与 zip 压缩包**两种形态：
            zip 版含 GUI + 命令行三个 exe，单文件版仅 GUI）。

            > 来源：Git tag `${{ steps.version.outputs.tag }}` · GitHub Actions 自动构建 · CI（Windows+Ubuntu × Py3.11/3.12）测试全绿（**581 passed**）。

            ### 🐛 修复（0.5.5）

            - **打开/关闭文件时的迟滞与内存增长**：每次打开或关闭标签都会重新枚举整个目录（含逐文件
              stat 与无后缀文件的 4KB 内容嗅探），在大目录里单次可达数十到数百毫秒；关闭标签时页面
              控件也从未真正销毁，每关一个留下约 144 个控件并持续占用内存，使用越久越慢。
              **修复**：目录枚举改用 `os.scandir` 并缓存结果（本地 NTFS 按修改时间精确失效，
              命中时滑动续期）；关闭标签时真正销毁页面控件。实测批量打开 30 个文件从 5.9 秒降到
              0.84 秒、全部关闭从 3.9 秒降到 0.17 秒，连续开关 20 轮后控件数与内存均回到基线。
            - **标准图片打开较慢**：图像数据被逐通道翻转并两次整帧拷贝后才交给界面。
              **修复**：直接把 OpenCV 的 BGR 缓冲交给 Qt 的 BGR888 格式，省掉翻转与两次拷贝
              （4000×3000 图片从约 743 毫秒降到约 497 毫秒），保存图片的通道顺序保持不变。
            - **快速连续选择预设时排序不生效**：Windows 系统时钟粒度约 15.6 毫秒，两次连续选择可能
              落在同一时刻，导致最近使用无法区分先后，刚选中的预设没有排到最前。
              **修复**：记录使用时间时保证严格递增（显式传入的时间戳保持原值不变）。
            - **切换图像类型后条件行可能残留空白**：面板禁用时切换到会隐藏条件字段的类型，
              隐藏行虽被禁用但仍占着表单行高。**修复**：隐藏行同时从表单中移除。
            - **重复打开同一文件会产生两个标签（0.5.5 新增修复）**：再次选择已打开的文件 A 时会
              新建第二个 A 标签，两份内容各自独立、互不同步。
              **修复**：按规范化路径（绝对路径 + realpath + 大小写归一）识别重复，命中时用最新内容
              覆盖原标签并**保持原位置**，不再新增标签；批量打开中的重复路径同样只保留一份且不会
              漏解码（回归测试含大小写变体、`.` 路径变体与批内重复）。
            - **外部修改文件后无法刷新显示（0.5.5 新增修复）**：打开文件 A 后若在外部更新了 A 的
              内容，raw-view 仍显示旧内容，必须手动关闭标签再重新打开。
              **修复**：新增右键重载，见下节「新功能」。
            - **后台标签重载会永久停在 "Decoding..."（0.5.5 新增修复）**：非当前标签的重载/去重
              打开结果被误归属到可见标签后丢弃，该标签再也无法完成解码。
              **修复**：为后台解码增加独立归属通道，结果正确回到它自己的标签。
            - **Reload All 在大批量下静默中断（0.5.5 新增修复）**：重载推进使用同栈递归，每项加深
              约 7 层，标准图片达到约 150 项时触发栈溢出；异常在 Qt 槽内被吞掉，剩余标签静默不再
              重载。**修复**：改为非递归循环 + 重入守卫，300 项全部正常重载。
            - **双击 Reload All 会冻结窗口（0.5.5 新增修复）**：重复触发使批次深度多加一层而只收尾
              一次，`updatesEnabled(False)` 永久残留、窗口不再重绘。**修复**：入口增加幂等守卫。
            - **批量打开进行中点 Reload All 会互等死锁（0.5.5 新增修复）**：打开队列与 Reload All
              各自等待对方，界面永久停在 "Decoding..."。**修复**：Reload All 显式接管打开队列并
              统一重新解码，保证所有标签最终都完成。
            - **连续快速解码时会偶发崩溃退出（0.5.5 新增修复）**：取消上一次解码时程序会主动放开
              对解码线程的引用，此后该线程只剩一条内部自引用；Python 的循环垃圾回收可能在**线程
              仍在运行**时将其回收，Qt 随即判定「销毁了运行中的线程」并直接终止进程（无任何提示、
              无对话框，窗口瞬间消失）。批量打开、连续切换文件或重置参数时最易触发。
              **修复**：对所有已启动但尚未结束的解码线程保持强引用，直到线程自身报告结束才释放；
              同时把后台解码对象的销毁时机改到线程完全停止之后，避免跨线程销毁引发的另一种崩溃。
            - 全量测试 **581 passed, 126 subtests**。

            ### 🆕 新功能 / 增强（0.5.5）
            - **标签右键 Reload（重载）**：在标签上右键 → *Reload*，即可把该 item 从磁盘重新读取并
              重新解码，等价于「关闭再重新打开」但**保持标签位置不变**，无需手动关闭。用于外部
              更新了文件内容后刷新显示。未 Apply 的面板编辑会丢弃（与关闭再打开一致），已记住的
              参数仍然生效，且重载不会写入参数记忆。
            - **标签右键 Reload All Items（全部重载）**：对所有已打开标签逐个重载，界面刷新合并为
              一次；批次串行执行并保证异常时不会留下冻结状态。
            - **批量打开与关闭更快**：多文件打开/关闭时合并界面刷新，避免逐文件重复重算导航与
              最近文件菜单。

            ### 使用方式

            **zip 版（推荐，含命令行）**：下载 `raw-view-${{ steps.version.outputs.version }}-windows-x64.zip` 解压，进入 `raw-view/`。
            包内三个 exe 各司其职，且**共用一份 `_internal/`**：

            | exe | 用途 |
            |---|---|
            | `raw-view.exe` | 双击启动 GUI；带命令/选项时自动转交命令行 |
            | `raw-view-gui.exe` | 只启动 GUI |
            | `raw-view-cli.exe` | 只跑命令行（不弹窗） |

            ```bash
            raw-view.exe --batch-help
            raw-view.exe view -i in.raw -o out.png --target RAW --raw-type RAW12 --width 1920 --height 1080
            raw-view.exe convert -i img.png --target YUV --yuv-type NV12 --width 2560 --height 1440
            raw-view.exe batch -b spec.json
            ```

            > **裸文件参数不支持**：`raw-view.exe a.raw` 不会自动变成 `view a.raw`（会报 usage、返回 2）。
            > 用 GUI 打开文件请写 `raw-view.exe view a.raw`，或直接把文件拖进窗口。

            **单文件版（仅 GUI）**：下载 `raw-view.exe` 双击运行。**该形态不提供命令行**，
            需要 `view` / `convert` / `batch` 请使用 zip 版。

            - **本地打包**：开发仓库中双击 `release.bat`（详见 `docs/release_exe.md`）。
            - 传感器预设保存在本机注册表/配置目录；团队共享可 *Manage sensor presets → Export / Import*。

            ### 功能总览
            - RAW 查看：RAW8/10/12/16/32、RAW10/12/14 Packed（MIPI CSI-2）、LSB/MSB、大小端、Bayer 彩色/灰度预览
            - YUV 查看：YOnly（+Bit depth 8/10/12/14/16）、I420/YV12/NV12/NV21/YUYV/UYVY/YVYU/VYUY/NV16/NV61
            - 转换：PNG/JPG/BMP → RAW / YUV；批量转换；多变体一键生成（格式×Bayer×分辨率）；覆盖确认
            - 帧导航（含文件版本感知 LRU 缓存）、缩放/旋转/翻转、多标签页（拖拽排序+关闭+●标记）、Prev/Next 文件
            - CLI 模式（view / convert / batch，支持 glob/base_dir）、日志系统、崩溃日志、Light/Dark 主题

            ### 文件
            - **`raw-view-${{ steps.version.outputs.version }}-windows-x64.zip`** — zip 压缩包（解压即用；含 launcher + GUI + CLI 三个 exe 与共享 `_internal/`，约 137 MB）
            - **`raw-view.exe`** — 单文件 exe（**仅 GUI**，约 123 MB）
            - 各附 `.sha256` 校验和（`sha256sum -c` 校验）

            ### 系统要求
            - Windows 10 1809+（64 位）
            - Visual C++ Redistributable 2015-2022（多数系统已自带）
          files: |
            dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
            dist/raw-view.exe
            dist/raw-view.exe.sha256
          fail_on_unmatched_files: true
