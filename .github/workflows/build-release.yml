# Build raw-view .exe / .zip and attach them to a GitHub Release.
#
# Triggers:
#   - on tags like v0.1.0 (the official release path)
#   - on demand from the Actions tab (workflow_dispatch)
#
# What it does:
#   1. Runs the full test suite (so a broken release is never published)
#   2. Builds all four executables from the ONE spec, raw-view.spec:
#        a. zip bundle     -> dist/raw-view/  (launcher + GUI + CLI, ONE _internal)
#        b. single file    -> dist/raw-view.exe  (GUI only)
#      A single Analysis feeds all four EXEs and a single COLLECT emits the
#      three side-by-side onedir executables. That is why they share exactly
#      one _internal directory, and why the layout cannot drift: PyInstaller
#      writes it, nothing is moved or copied afterwards.
#      The same spec is used by the local release.bat, so the two build paths
#      cannot diverge. See the spec's module docstring for the reasoning
#      (four separate PyInstaller runs re-analysed the same dependency tree
#      four times: 1315 s -> ~120 s).
#   3. Zips the onedir bundle into a "unzip-and-run" package with the
#      version in its file name (raw-view-<version>-windows-x64.zip).
#   4. Runs the exe with --help (CLI smoke test) and lists the artifacts
#   5. Attaches exe + zip + SHA-256 checksums to the release
#
# Version source of truth: the git tag (v0.1.0 -> product version 0.1.0).

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build exe + zip and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.Python_ROOT_DIR }}\Scripts
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 叠加 constraints.txt 锁定已实测一致的精确版本，保证可复现。
          # 注：-c/--constraint 必须与安装需求同一条命令使用；pyinstaller 单独按
          # constraints 锁定版本安装。
          pip install -r requirements.txt -c constraints.txt
          pip install pyinstaller==6.20.0

      - name: Run test suite
        run: python -m unittest discover -s tests -q

      - name: Smoke test CLI (before packaging)
        run: python -m raw_view --batch-help

      # 一次构建产出全部四个 exe：单个 Analysis 同时喂给 launcher / GUI / CLI
      # 三个 onedir EXE 与一个 onefile EXE，COLLECT 只做一次，因此三个 onedir
      # exe 必然与同一份 _internal 同级——布局由 PyInstaller 直接产出，没有
      # 任何 staging / move / copy 步骤。
      #
      # 旧实现是四次独立 pyinstaller 调用（各自完整分析同一棵依赖树）：
      # 实测 412 + 394 + 238 + 270 = 1315 s；单 Analysis 约 120 s。
      # 同一份 raw-view.spec 也被本地 release.bat 使用，两条构建路径不会漂移。
      - name: Build artifacts from raw-view.spec (single Analysis)
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build raw-view.spec
          foreach ($path in @(
            'dist/raw-view/raw-view.exe',
            'dist/raw-view/raw-view-gui.exe',
            'dist/raw-view/raw-view-cli.exe',
            'dist/raw-view/_internal/python312.dll',
            'dist/raw-view.exe'
          )) {
            if (-not (Test-Path $path)) { throw "missing artifact: $path" }
          }

      - name: Verify artifacts exist
        run: |
          $required = @(
            'dist\raw-view.exe',
            'dist\raw-view\raw-view.exe',
            'dist\raw-view\raw-view-gui.exe',
            'dist\raw-view\raw-view-cli.exe',
            'dist\raw-view\_internal'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "missing artifact: $path" }
          }
          Get-ChildItem dist\raw-view | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
          Get-Item dist\raw-view.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
          # The three executables must share ONE _internal, not three.
          $trees = @(Get-ChildItem dist\raw-view -Recurse -Directory -Filter _internal)
          if ($trees.Count -ne 1) { throw "expected exactly one _internal, found $($trees.Count)" }

      # 校验 PE subsystem：launcher/GUI 必须是 GUI(2)，CLI 必须是 Console(3)。
      # 这是三 exe 方案的核心契约——写错会让 CLI 弹黑框或让 GUI 带控制台。
      - name: Verify PE subsystems (2 / 2 / 3)
        shell: pwsh
        run: |
          function Get-Subsystem($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          }
          $expect = @{
            'dist\raw-view\raw-view.exe'     = 2
            'dist\raw-view\raw-view-gui.exe' = 2
            'dist\raw-view\raw-view-cli.exe' = 3
          }
          foreach ($pair in $expect.GetEnumerator()) {
            $actual = Get-Subsystem $pair.Key
            Write-Host "$($pair.Key): subsystem=$actual (expected $($pair.Value))"
            if ($actual -ne $pair.Value) { throw "wrong subsystem for $($pair.Key): $actual" }
          }

      # 冒烟：CLI 路径（直接测 console exe，避免 launcher 的终端依赖干扰 CI）。
      - name: Smoke test CLI executable
        run: .\dist\raw-view\raw-view-cli.exe --batch-help

      # 冒烟：launcher 转发。两条断言都不能用 pwsh 的默认方式：
      #
      # 1) 文件重定向必须走 cmd。PowerShell 7 对 **GUI 子系统**（PE subsystem=2）
      #    的进程不等它结束就返回，随即拆掉自己建的 stdout 重定向管道；launcher
      #    是 --windowed 构建（必须如此，否则双击会闪黑框），于是
      #    `raw-view.exe --version > f` 在 pwsh 下得到空文件，退出时抛
      #    `OSError: [Errno 22]`。同一命令在 cmd 下正常，换成 console 子系统的
      #    raw-view-cli.exe 也正常 —— **这是 pwsh 的平台行为，不是产品缺陷**
      #    （详见 docs/release_exe.md 的「已知限制」）。
      # 2) `$LASTEXITCODE` 只会由 PowerShell 等待过的原生命令设置，未等待的 GUI
      #    子系统进程不会。退出码改用同步等待的 cli.exe 断言。
      #
      # 版本串按 argparse 的 %(prog)s 实际输出校验（`python -m raw_view x.y.z`，
      # 下划线），不硬编码 `raw-view`（连字符）。
      - name: Smoke test launcher forwarding
        shell: pwsh
        run: |
          # 1) 产物可运行 + 转发到 CLI：用 cmd 做文件重定向（pwsh 下不可靠，见上）。
          cmd /c ".\dist\raw-view\raw-view.exe --version > version.txt"
          $version = (Get-Content -Raw version.txt).Trim()
          Write-Host "launcher --version -> [$version]"
          if (-not $version) { throw "launcher --version produced no output" }
          if ($version -notmatch '\d+\.\d+\.\d+') {
            throw "launcher --version did not report a version: [$version]"
          }

          # 2) 管道转发：先捕获成变量再匹配。
          #    不要写 `cmd /c ... | Select-String`——那条依赖 pwsh 与 GUI 子系统
          #    进程的时序，本机与 runner 表现不一致；先捕获消除了这层依赖。
          $help = (cmd /c ".\dist\raw-view\raw-view.exe -h") -join "`n"
          if ($help -notmatch 'batch-help') { throw "launcher -h did not forward to the CLI" }

          # 3) 裸文件名必须报 usage（rc=2），绝不能启动 GUI 阻塞 CI。
          #    cli.exe 是 console 子系统，同步等待，$LASTEXITCODE 可靠（区别于
          #    上面的 launcher）；launcher 的分流正确性由 tests/test_launcher.py
          #    的 26 个用例覆盖。不要用 `& echo %errorlevel%`：PowerShell 会先把
          #    %errorlevel% 当环境变量展开成空/0。
          cmd /c ".\dist\raw-view\raw-view-cli.exe bare.raw 2>nul"
          Write-Host "raw-view-cli.exe bare.raw -> exit $LASTEXITCODE"
          if ($LASTEXITCODE -ne 2) {
            throw "bare filename should exit 2, got $LASTEXITCODE"
          }

          # 4) 关键：把步骤退出码归零。
          #    GitHub Actions 的 pwsh 包装器会在脚本末尾追加 `exit $LASTEXITCODE`。
          #    上面第 3 条明知故犯地让 cli.exe 以 rc=2 退出（断言用法错误），于是
          #    $LASTEXITCODE 停在 2——**三条断言全部通过，步骤却以非零退出码失败**。
          #    实测：同一脚本无此句 exit 0，有此句 exit $LASTEXITCODE=2。
          #    所有断言都用显式 throw 表达失败，这里不需要靠退出码传递任何信息。
          $global:LASTEXITCODE = 0

      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          # v0.1.0 -> 0.1.0 ; manual runs fall back to 0.1.0-dev
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == "refs/heads/"* || "$REF" == "$GITHUB_REF" ]]; then REF="0.1.0-dev"; fi
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      # 在版本号步骤之后压缩，zip 文件名才能带上版本号：
      #   dist/raw-view-<version>-windows-x64.zip
      # 源目录 dist/raw-view/ 由 "Collect release artifacts into dist" 步骤保证存在。
      - name: Compress onedir bundle into a zip
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ZIP = "dist\raw-view-$VERSION-windows-x64.zip"
          if (-not (Test-Path dist\raw-view)) { throw "source dist\raw-view not found" }
          if (Test-Path $ZIP) { Remove-Item $ZIP -Force }
          Compress-Archive -Path dist\raw-view -DestinationPath $ZIP
          Get-Item $ZIP | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum dist/raw-view.exe > dist/raw-view.exe.sha256
          # bash 的 glob 不会在重定向目标里展开，必须先用变量拿到 zip 的实际文件名
          ZIP="dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip"
          sha256sum "$ZIP" > "$ZIP.sha256"
          cat dist/raw-view.exe.sha256
          cat "$ZIP.sha256"
          # 空的校验和文件绝不能发布（历史上本地脚本曾因 PowerShell 5.1 没有
          # Get-FileHash 而写出只含 " *文件名" 的空文件；这里设防）。
          for f in dist/raw-view.exe.sha256 "$ZIP.sha256"; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 70 ]; then
              echo "::error::checksum file looks empty: $f ($size bytes)"
              exit 1
            fi
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: raw-view ${{ steps.version.outputs.version }}
          # body 必须遵循 docs/release-template.md 的标准格式（发布即最终版，
          # 不再依赖事后 gh release edit）。每次打 tag 前，将当前版本的
          # 修复/新功能清单按模板填入下面的 body。占位符 {{ }} 由 GITHUB 上下文填充。
          body: |
            ## raw-view ${{ steps.version.outputs.version }}

            Python 实现的 RAW / YUV 图像查看与格式转换工具（Windows，提供**单文件 exe 与 zip 压缩包**两种形态：
            zip 版含 GUI + 命令行三个 exe，单文件版仅 GUI）。

            > 来源：Git tag `${{ steps.version.outputs.tag }}` · GitHub Actions 自动构建 · CI（Windows+Ubuntu × Py3.11/3.12）测试全绿（**822 passed**）。

            ### 🛠 构建与打包（0.5.8）

            - **发布包体积缩小约 23%**：压缩包 147.7 → 113.9 MB，单文件 exe
              130.2 → 99.1 MB，包内文件数 3178 → 574。此前打包把大量实际用不到的
              Qt 资源一并收了进去——QML 运行时（2647 个文件）、所有 Qt 插件
              （264 个，实际只需要 17 个）、以及重复收录了两遍的翻译文件。
              **修复**：改为按代码实际引用精确收集，只保留用到的平台、图片格式
              与样式插件。界面渲染与改动前逐像素一致。
            - **构建时间从 25 分钟降到 8 分钟**：此前为四个可执行文件各自完整跑一次
              打包分析，同一套依赖被收集了四遍。**修复**：改为一次分析、生成四个
              可执行文件，共享同一份依赖。
            - **修复校验和文件无效的问题（本地打包）**：本地 `release.bat` 生成的
              `.sha256` 文件里**只有文件名、没有哈希值**，脚本却报告成功。原因是
              它调用的 `Get-FileHash` 只在 PowerShell 7 及以上存在，而标准
              Windows 的 `powershell` 是 5.1。**修复**：改用 Python 计算，并按
              文件大小设守卫（内容异常时直接失败）。GitHub 自动发布的校验和
              一直正常，不受影响。
            - **修复本地打包时 exe 可能落错目录的问题**：如果上一次打包的
              `dist` 目录被别的程序占用（例如在资源管理器或终端里停在那个目录），
              删除会静默失败，随后脚本把产物嵌套一层，得到的 exe 找不到同级的
              依赖目录，运行时直接报 `Failed to load Python DLL`。**修复**：删除
              失败时立即中止并说明原因，不再产出坏布局；新流程也不再需要移动
              或拷贝产物。
            - 全量测试 **822 passed, 659 subtests**。

            ### 使用方式

            **zip 版（推荐，含命令行）**：下载 `raw-view-${{ steps.version.outputs.version }}-windows-x64.zip` 解压，进入 `raw-view/`。
            包内三个 exe 各司其职，且**共用一份 `_internal/`**：

            | exe | 用途 |
            |---|---|
            | `raw-view.exe` | 双击启动 GUI；带命令/选项时自动转交命令行 |
            | `raw-view-gui.exe` | 只启动 GUI |
            | `raw-view-cli.exe` | 只跑命令行（不弹窗） |

            ```bash
            raw-view.exe --batch-help
            raw-view.exe view -i in.raw -o out.png --target RAW --raw-type RAW12 --width 1920 --height 1080
            raw-view.exe convert -i img.png --target YUV --yuv-type NV12 --width 2560 --height 1440
            raw-view.exe batch -b spec.json
            ```

            > **裸文件参数不支持**：`raw-view.exe a.raw` 不会自动变成 `view a.raw`（会报 usage、返回 2）。
            > 用 GUI 打开文件请写 `raw-view.exe view a.raw`，或直接把文件拖进窗口。

            **单文件版（仅 GUI）**：下载 `raw-view.exe` 双击运行。**该形态不提供命令行**，
            需要 `view` / `convert` / `batch` 请使用 zip 版。

            - **本地打包**：开发仓库中双击 `release.bat`（详见 `docs/release_exe.md`）。
            - 传感器预设保存在本机注册表/配置目录；团队共享可 *Manage sensor presets → Export / Import*。

            ### 功能总览
            - RAW 查看：RAW8/10/12/16/32、RAW10/12/14 Packed（MIPI CSI-2）、LSB/MSB、大小端、Bayer 彩色/灰度预览
            - YUV 查看：YOnly（+Bit depth 8/10/12/14/16）、I420/YV12/NV12/NV21/YUYV/UYVY/YVYU/VYUY/NV16/NV61
            - 转换：PNG/JPG/BMP → RAW / YUV；批量转换；多变体一键生成（格式×Bayer×分辨率）；覆盖确认
            - 帧导航（含文件版本感知 LRU 缓存）、缩放/旋转/翻转、多标签页（拖拽排序+关闭+●标记）、Prev/Next 文件
            - CLI 模式（view / convert / batch，支持 glob/base_dir）、日志系统、崩溃日志、Light/Dark 主题

            ### 文件
            - **`raw-view-${{ steps.version.outputs.version }}-windows-x64.zip`** — zip 压缩包（解压即用；含 launcher + GUI + CLI 三个 exe 与共享 `_internal/`，约 114 MB）
            - **`raw-view.exe`** — 单文件 exe（**仅 GUI**，约 99 MB）
            - 各附 `.sha256` 校验和（`sha256sum -c` 校验）

            ### 系统要求
            - Windows 10 1809+（64 位）
            - Visual C++ Redistributable 2015-2022（多数系统已自带）
          files: |
            dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
            dist/raw-view.exe
            dist/raw-view.exe.sha256
          fail_on_unmatched_files: true
