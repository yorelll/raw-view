# Build raw-view .exe / .zip and attach them to a GitHub Release.
#
# Triggers:
#   - on tags like v0.1.0 (the official release path)
#   - on demand from the Actions tab (workflow_dispatch)
#
# What it does:
#   1. Runs the full test suite (so a broken release is never published)
#   2. Installs PyInstaller and builds TWO artifacts:
#        a. onedir bundle  -> dist/raw-view/  (directory with all deps)
#        b. single file    -> dist/raw-view.exe
#      Each is staged under .artifact/ first so the two PyInstaller runs
#      (both --noconfirm --clean) never delete each other's output.
#   3. Zips the onedir bundle into a "unzip-and-run" package with the
#      version in its file name (raw-view-<version>-windows-x64.zip).
#   4. Runs the exe with --help (CLI smoke test) and lists the artifacts
#   5. Attaches exe + zip + SHA-256 checksums to the release
#
# Version source of truth: the git tag (v0.1.0 -> product version 0.1.0).

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build exe + zip and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.Python_ROOT_DIR }}\Scripts
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 叠加 constraints.txt 锁定已实测一致的精确版本，保证可复现。
          # 注：-c/--constraint 必须与安装需求同一条命令使用；pyinstaller 单独按
          # constraints 锁定版本安装。
          pip install -r requirements.txt -c constraints.txt
          pip install pyinstaller==6.20.0

      - name: Run test suite
        run: python -m unittest discover -s tests -q

      - name: Smoke test CLI (before packaging)
        run: python -m raw_view --batch-help

      # PyInstaller 两次打包都会 --noconfirm --clean 清理 build/ 与 dist/，
      # 因此两次产物分别落盘到独立 staging 目录（.artifact/raw-view.exe 与
      # .artifact/raw-view/），避免 "后一次打包删掉前一次产物"。
      #
      # 第一次：onedir 目录 bundle（解压即用，含全部依赖）。
      # 注意：.venv 是本机专用路径，CI（GitHub Actions）默认把依赖装进 Actions 自带
      # 的 Python，不存在 .venv/；而 PyInstaller 对不存在的 --add-data 源目录会直接
      # 报 ERROR 失败。因此 translations 路径由当前 python 安装位置推导，
      # 两种环境都能跑；缺失时仅提示（Qt 自带默认英文本地化，不影响功能）。
      - name: Build onedir bundle with PyInstaller
        run: |
          # 用 Python 运行时查询实际 PyQt5 translations 路径，而不是从 python.exe
          # 路径手工 Split-Path 推导（后者在 GitHub Actions 的 Python 布局下会多退
          # 一级导致找不到目录，发布包缺失 Qt 本地化——0.2.1 review L-2）。
          $QT_TRANSLATIONS = python -c "import os, PyQt5; print(os.path.join(os.path.dirname(PyQt5.__file__), 'Qt5', 'translations'))"
          if (Test-Path $QT_TRANSLATIONS) {
            pyinstaller --noconfirm --clean --windowed --name raw-view `
              --hidden-import=cv2 `
              --hidden-import=PIL `
              --collect-all=cv2 `
              --collect-all=PyQt5 `
              --collect-all=qt_material `
              --collect-all=qtawesome `
              --collect-all=pypinyin `
              --icon assets/raw-view.ico `
              --add-data "assets;assets" `
              --add-data "$QT_TRANSLATIONS;Qt5/translations" `
              raw_view/__main__.py
          } else {
            Write-Host "PyQt5 Qt5 translations not found at $QT_TRANSLATIONS; skipping translations (Qt falls back to English built-ins)."
            pyinstaller --noconfirm --clean --windowed --name raw-view `
              --hidden-import=cv2 `
              --hidden-import=PIL `
              --collect-all=cv2 `
              --collect-all=PyQt5 `
              --collect-all=qt_material `
              --collect-all=qtawesome `
              --collect-all=pypinyin `
              --icon assets/raw-view.ico `
              --add-data "assets;assets" `
              raw_view/__main__.py
          }
          # 目录模式输出到 dist/raw-view/，移入 staging 供压缩与 smoke test。
          New-Item -ItemType Directory -Force .artifact | Out-Null
          Move-Item dist\raw-view .artifact\raw-view

      # 第二次：单文件 exe（--onefile），同样落到 staging，而不是留在 dist/，
      # 避免后续 --clean 步骤与 dist/ 目录混淆。
      - name: Build single-file exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name raw-view `
            --hidden-import=cv2 `
            --hidden-import=PIL `
            --collect-all=cv2 `
            --collect-all=PyQt5 `
            --collect-all=qt_material `
            --collect-all=qtawesome `
            --collect-all=pypinyin `
            --icon assets/raw-view.ico `
            --add-data "assets;assets" `
            raw_view/__main__.py
          Move-Item dist\raw-view.exe .artifact\raw-view.exe

      - name: Collect release artifacts into dist
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item .artifact\raw-view.exe dist\raw-view.exe
          # onedir 目录整体拷回 dist/raw-view/（若某步未生成会立刻失败）
          if (-not (Test-Path .artifact\raw-view\raw-view.exe)) { throw "onedir bundle missing: .artifact\raw-view\raw-view.exe" }
          Copy-Item -Recurse -Force .artifact\raw-view dist\raw-view

      - name: Verify the exe exists
        run: |
          if (-not (Test-Path dist\raw-view.exe)) { throw "dist\raw-view.exe not found" }
          Get-Item dist\raw-view.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
          if (-not (Test-Path dist\raw-view\raw-view.exe)) { throw "dist\raw-view\raw-view.exe (onedir) not found" }
          Get-Item dist\raw-view\raw-view.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Smoke test CLI (onedir bundle)
        run: .\dist\raw-view\raw-view.exe --batch-help

      - name: Smoke test CLI (single-file exe)
        run: .\dist\raw-view.exe --batch-help

      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          # v0.1.0 -> 0.1.0 ; manual runs fall back to 0.1.0-dev
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == "refs/heads/"* || "$REF" == "$GITHUB_REF" ]]; then REF="0.1.0-dev"; fi
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      # 在版本号步骤之后压缩，zip 文件名才能带上版本号：
      #   dist/raw-view-<version>-windows-x64.zip
      # 源目录 dist/raw-view/ 由 "Collect release artifacts into dist" 步骤保证存在。
      - name: Compress onedir bundle into a zip
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ZIP = "dist\raw-view-$VERSION-windows-x64.zip"
          if (-not (Test-Path dist\raw-view)) { throw "source dist\raw-view not found" }
          if (Test-Path $ZIP) { Remove-Item $ZIP -Force }
          Compress-Archive -Path dist\raw-view -DestinationPath $ZIP
          Get-Item $ZIP | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum dist/raw-view.exe > dist/raw-view.exe.sha256
          # bash 的 glob 不会在重定向目标里展开，必须先用变量拿到 zip 的实际文件名
          ZIP="dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip"
          sha256sum "$ZIP" > "$ZIP.sha256"
          cat dist/raw-view.exe.sha256
          cat "$ZIP.sha256"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: raw-view ${{ steps.version.outputs.version }}
          # body 必须遵循 docs/release-template.md 的标准格式（发布即最终版，
          # 不再依赖事后 gh release edit）。每次打 tag 前，将当前版本的
          # 修复/新功能清单按模板填入下面的 body。占位符 {{ }} 由 GITHUB 上下文填充。
          body: |
            ## raw-view ${{ steps.version.outputs.version }}

            Python 实现的 RAW / YUV 图像查看与格式转换工具（Windows，提供**单文件 exe 与 zip 压缩包**两种形态）。

            > 来源：Git tag `${{ steps.version.outputs.tag }}` · GitHub Actions 自动构建 · CI（Windows+Ubuntu × Py3.11/3.12）测试全绿（**537 passed**）。

            ### 🐛 修复（0.5.3）

            - **打开/关闭文件时的迟滞与内存增长**：每次打开或关闭标签都会重新枚举整个目录（含逐文件
              stat 与无后缀文件的 4KB 内容嗅探），在大目录里单次可达数十到数百毫秒；关闭标签时页面
              控件也从未真正销毁，每关一个留下约 144 个控件并持续占用内存，使用越久越慢。
              **修复**：目录枚举改用 `os.scandir` 并缓存结果（本地 NTFS 按修改时间精确失效，
              命中时滑动续期）；关闭标签时真正销毁页面控件。实测批量打开 30 个文件从 5.9 秒降到
              0.84 秒、全部关闭从 3.9 秒降到 0.17 秒，连续开关 20 轮后控件数与内存均回到基线。
            - **标准图片打开较慢**：图像数据被逐通道翻转并两次整帧拷贝后才交给界面。
              **修复**：直接把 OpenCV 的 BGR 缓冲交给 Qt 的 BGR888 格式，省掉翻转与两次拷贝
              （4000×3000 图片从约 743 毫秒降到约 497 毫秒），保存图片的通道顺序保持不变。
            - **快速连续选择预设时排序不生效**：Windows 系统时钟粒度约 15.6 毫秒，两次连续选择可能
              落在同一时刻，导致最近使用无法区分先后，刚选中的预设没有排到最前。
              **修复**：记录使用时间时保证严格递增（显式传入的时间戳保持原值不变）。
            - **切换图像类型后条件行可能残留空白**：面板禁用时切换到会隐藏条件字段的类型，
              隐藏行虽被禁用但仍占着表单行高。**修复**：隐藏行同时从表单中移除。
            - 全量测试 **537 passed, 126 subtests**。

            ### 🆕 新功能 / 增强（0.5.3）
            - **批量打开与关闭更快**：多文件打开/关闭时合并界面刷新，避免逐文件重复重算导航与
              最近文件菜单。

            ### 使用方式
            - **zip 版（推荐）**：下载 `raw-view-${{ steps.version.outputs.version }}-windows-x64.zip` 解压，进入 `raw-view/` 运行 `raw-view.exe`。
            - **单文件版**：下载 `raw-view.exe` 双击运行。
            - **本地打包**：开发仓库中双击 `release.bat`（详见 `docs/release_exe.md`）。
            - 命令行示例：`raw-view.exe convert -i img.png --target YUV --yuv-type YOnly12 --width 2560 --height 1440 --alignment lsb --endianness big`；`raw-view.exe --batch-help`。
            - 传感器预设保存在本机注册表/配置目录；团队共享可 *Manage sensor presets → Export / Import*。

            ### 功能总览
            - RAW 查看：RAW8/10/12/16/32、RAW10/12/14 Packed（MIPI CSI-2）、LSB/MSB、大小端、Bayer 彩色/灰度预览
            - YUV 查看：YOnly（+Bit depth 8/10/12/14/16）、I420/YV12/NV12/NV21/YUYV/UYVY/YVYU/VYUY/NV16/NV61
            - 转换：PNG/JPG/BMP → RAW / YUV；批量转换；多变体一键生成（格式×Bayer×分辨率）；覆盖确认
            - 帧导航（含文件版本感知 LRU 缓存）、缩放/旋转/翻转、多标签页（拖拽排序+关闭+●标记）、Prev/Next 文件
            - CLI 模式（view / convert / batch，支持 glob/base_dir）、日志系统、崩溃日志、Light/Dark 主题

            ### 文件
            - **`raw-view-${{ steps.version.outputs.version }}-windows-x64.zip`** — zip 压缩包（onedir，解压即用，约 130 MB）
            - **`raw-view.exe`** — 单文件 exe（约 125 MB）
            - 各附 `.sha256` 校验和（`sha256sum -c` 校验）

            ### 系统要求
            - Windows 10 1809+（64 位）
            - Visual C++ Redistributable 2015-2022（多数系统已自带）
          files: |
            dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/raw-view-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
            dist/raw-view.exe
            dist/raw-view.exe.sha256
          fail_on_unmatched_files: true
