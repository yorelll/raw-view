# Continuous Integration — run the full test suite on every push and PR.
#
# Unlike build-release.yml (which only runs on tags / manual dispatch and
# publishes a release), this workflow runs on EVERY push to any branch and on
# every pull request, so regressions are caught as early as possible.

name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 测试套件偶发卡死（Qt 事件循环里某次 processEvents() 不返回）。GitHub 默认
    # 超时是 360 分钟，卡住的 job 会白占 runner 一个半小时以上；这里收到 20 分钟，
    # 正常全量约 3–4 分钟，留足余量。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~/.cache/pip
          key: ${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 叠加 constraints.txt 锁定已实测一致的精确版本，保证可复现。
          # 注：-c/--constraint 必须与安装需求同一条命令使用（pip 不允许单独 -c 而不给包名）。
          pip install -r requirements.txt -c constraints.txt

      - name: Run test suite (unittest)
        # 看门狗：套件偶发卡死（Qt processEvents() 不返回），此时进程不会再输出
        # 任何东西，普通超时只能看到"卡住"而拿不到现场。10 分钟后打印所有线程的
        # Python 栈再退出（典型耗时 3–4 分钟，10 分钟足够区分"慢"与"卡死"）。
        run: python tools/ci_test_watchdog.py

      - name: Smoke test CLI --batch-help
        run: python -m raw_view --batch-help

      - name: Smoke test CLI view/convert round-trip
        shell: bash
        run: |
          set -e
          mkdir -p .ci_tmp
          python -c "import numpy as np, cv2; img = (np.random.RandomState(0).rand(8,8,3)*255).astype('uint8'); cv2.imwrite('.ci_tmp/ci_input.png', img)"
          python -m raw_view convert -i .ci_tmp/ci_input.png -o .ci_tmp/ci_out.raw --target RAW --raw-type RAW12 --width 8 --height 8 --alignment msb
          python -m raw_view view -i .ci_tmp/ci_out.raw -o .ci_tmp/ci_view.png --target RAW --raw-type RAW12 --width 8 --height 8 --alignment msb
          test -s .ci_tmp/ci_out.raw
          test -s .ci_tmp/ci_view.png
          echo "CLI round-trip OK"
        env:
          # CLI 打印含 Unicode 提示，Windows runner 默认 cp1252；显式走 UTF-8。
          PYTHONUTF8: "1"
